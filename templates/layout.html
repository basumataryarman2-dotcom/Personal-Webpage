<!DOCTYPE html>
<html lang="en">
    <head>
        <!--mostly copy paste from boostrap cause idk how all this works-->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!--bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <title>{%block title %}{% endblock %} </title>
  </head>
    <body class="{{ 'bg-dark' if mode == 'dark' else 'bg-white' }}">
         <nav class="{{'bg-dark' if mode == 'dark' else 'bg-white'}} navbar navbar-expand-md {{'navbar-light' if mode == 'light' else 'navbar-dark'}}">
            <div class="container-fluid">
                <a class="navbar-brand" href="/"><span class="blue">Home</span><span class="red"></a>
                <button aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navbar" data-bs-toggle="collapse" type="button">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                        <ul class="navbar-nav me-auto mt-2">
                            <li class="nav-item"><a class="nav-link" href="/Interests">Interests</a></li>
                            <li class="nav-item"><a class="nav-link" href="/Skills">Skills</a></li>
                        </ul>
                        {% if mode=="light" %}
                        <form action="{{current}}" method="post">
                        <div class="d-flex justify-content-end ms-md-auto">
                            <button type="submit" class="btn btn-outline-secondary">Dark mode</button>
                        </div>
                        </form>
                        {% endif %}
                        {% if mode=="dark"%}
                        <form action="{{ current }}" method="post">
                        <div class="d-flex justify-content-end ms-md-auto">
                            <button type="submit" class="btn btn-outline-light">Light mode</button>
                        </div>
                        </form>
                        {% endif %}
                </div>
                
            </div>
        </nav>
        <main class="container py-5 text-center">
            {% block main %}{% endblock %}
        </main>
    </body>
</html>
